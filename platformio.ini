; PlatformIO project — ESP32 Arduino firmware for Tuya Smart Life light control
; https://docs.platformio.org/

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/pio_pre_copy_secrets.py
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
